name: "🚀 Deployment"

on:
  push:
    branches:
      - main
      - devel

permissions:
  contents: write

jobs:
  Deployment:
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel' }}
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # ÉTAPE CRUCIALE : Forcer Node.js 22 pour supporter globSync
      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🐰 Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 🔗 Install dependencies
        run: bun install

      - name: 🎨 Build
        run: bun run build
        env:
          # On force le moteur de build à injecter le bon préfixe
          BASE_URL: /portfolio/
          PUBLIC_WEB3FORMS_KEY: ${{ vars.WEB3FORMS_KEY }}
      - name: 🚀 Deploy
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/dist
          publish_branch: pages
